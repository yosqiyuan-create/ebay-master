<style>
:root{--main:#1f4e79;--acc:#e8a317;--ok:#2e7d32;--ng:#c62828;--bg:#f4f6f9;--card:#fff;--txt:#222;--sub:#666;--line:#dde2e8}

const STAGES2=[
{id:5,title:"商品リサーチ",sub:"売れた商品の調べ方・相場",body:`
<h3>リサーチの基本：「売れた値段」を見る</h3>
<p>出品中の値段は「売りたい値段」で、本当に売れるとは限りません。大事なのは<b>実際に売れた値段（Sold）</b>です。</p>
<h3>方法1：eBayの検索で「Sold Items」</h3>
<ul><li>ebay.comで商品名を英語で検索（例：Canon AE-1）</li><li>絞り込み（Filter）で<b>「Sold Items（売れた商品）」</b>にチェック</li><li>緑色の値段が「売れた値段」です</li></ul>
<h3>方法2：Terapeak（テラピーク）</h3>
<p>Seller Hub（セラーハブ）の「Research」から使える公式の調査ツールです。過去の販売データ（売れた数・平均価格・送料など）を無料で調べられます。</p>
<h3>見るべき4つのポイント</h3>
<table><tr><th>ポイント</th><th>見る理由</th></tr>
<tr><td>売れた値段</td><td>いくらで売れるか（相場）</td></tr>
<tr><td>売れた数</td><td>よく売れる商品か（回転の速さ）</td></tr>
<tr><td>出品中の数</td><td>ライバルが多すぎないか</td></tr>
<tr><td>送料の設定</td><td>送料込みでいくらか</td></tr></table>
<h3>日本から売りやすい商品の特徴</h3>
<ul><li>日本でしか手に入らない（日本限定品・日本版）</li><li>日本の中古品の状態の良さが活きる（カメラ・時計・ゲーム）</li><li>小さくて軽い（送料が安い）</li><li>壊れにくい</li></ul>
<h3>注意したい商品</h3>
<ul><li>偽物の可能性がある有名ブランド品</li><li>VeRO（ヴェロ）対象：ブランドの権利者が出品を取り消せる仕組み。違反を重ねると制限を受ける</li><li>送れない物（段階9）</li></ul>
<div class="point">📌 まとめ<br>・相場は「Sold Items（売れた値段）」で調べる<br>・Terapeakで過去の販売データが無料で見られる<br>・売れた値段と数、ライバルの数、送料を確認<br>・日本限定・小さく軽い・壊れにくい物が売りやすい</div>`,
quiz:[
["相場を調べるときに一番大事な値段は？",["実際に売れた値段（Sold）","出品中の一番高い値段","日本での定価","自分が売りたい値段"],0,"出品中の値段は売れるとは限りません。売れた値段が相場です。"],
["eBayの検索で売れた商品だけを表示する絞り込みは？",["Sold Items","Buy It Now","Free Shipping","New Listings"],0,"Filterで「Sold Items」にチェックします。"],
["Seller Hubから使える公式の販売データ調査ツールは？",["Terapeak（テラピーク）","Google翻訳","Payoneer","SpeedPAK"],0,"TerapeakはSeller HubのResearchから無料で使えます。"],
["「売れた数」を見る理由は？",["よく売れる商品か（回転の速さ）を知るため","送料を知るため","手数料を知るため","英語を覚えるため"],0,"売れた数が多いほど、早く売れやすい商品です。"],
["日本から売りやすい商品の特徴として正しいのは？",["日本でしか手に入らない","大きくて重い","壊れやすい","どこの国でも安く買える"],0,"日本限定品などは海外で手に入りにくいので売りやすいです。"],
["小さくて軽い商品が有利な理由は？",["送料が安くなるから","手数料が無料になるから","関税がかからないから","評価が上がるから"],0,"送料は重さと大きさで決まります。"],
["VeROとは何？",["ブランドの権利者が出品を取り消せる仕組み","eBayの配送サービス","手数料の割引","英語の検定"],0,"権利者が権利を侵害していると判断した出品を取り消せる仕組みです。"],
["出品中の数（ライバル）を見る理由は？",["ライバルが多すぎて売れにくくないか確かめるため","手数料を計算するため","関税を知るため","写真の枚数を決めるため"],0,"ライバルが多いと値下げ競争になりやすいです。"],
["相場を調べるとき、値段と一緒に確認すべきものは？",["送料の設定","出品者の名前の長さ","商品ページの色","出品した曜日だけ"],0,"送料込みの合計で比べないと正しい相場になりません。"],
["偽物の可能性がある有名ブランド品について正しい考え方は？",["初心者は避ける","高く売れるので積極的に扱う","説明に書かなければ問題ない","安く売れば問題ない"],0,"偽物の販売はアカウント停止につながる危険があります。"]
]},
{id:6,title:"仕入れ",sub:"仕入れ先と仕入れ値の決め方",body:`
<h3>主な仕入れ先</h3>
<table><tr><th>仕入れ先</th><th>特徴</th></tr>
<tr><td>家の不用品</td><td>仕入れ値0円。練習に最適</td></tr>
<tr><td>リサイクルショップ・中古店</td><td>実物を確認できる。掘り出し物がある</td></tr>
<tr><td>フリマ・ネットオークション</td><td>種類が多い。写真だけで判断するので注意</td></tr>
<tr><td>新品の店・量販店</td><td>日本限定品や新品の人気商品</td></tr>
<tr><td>卸・メーカー</td><td>慣れてから。まとめて安く仕入れられる</td></tr></table>
<p>※中古品を仕入れて売るなら古物商許可が必要です（段階2）。</p>
<h3>仕入れ値の決め方（逆算）</h3>
<div class="point">いくらで売れるか（相場）を先に調べる → 手数料・送料・関税を引く → 残った額から、ほしい利益を引いた額が「仕入れてよい上限」</div>
<p>「お金」タブの「仕入れ上限」に、売れる値段とほしい利益を入れると、仕入れてよい上限がすぐにわかります。</p>
<h3>目標の利益率</h3>
<p>初心者は<b>利益率20%前後</b>を一つの目安にすると、値下げや送料の変化があっても赤字になりにくいです。</p>
<h3>避けるべき仕入れ</h3>
<ul><li>偽物やコピー品の疑いがある物</li><li>動作確認ができない電化製品（説明できない）</li><li>海外に送れない物（段階9）</li></ul>
<h3>無在庫販売に注意</h3>
<p>手元にない商品を出品して、売れてから仕入れる方法を「無在庫販売」と言います。仕入れられないと<b>在庫切れでキャンセル</b>になり、アカウントの評価が下がります（段階11）。初心者は<b>手元にある物だけ</b>を出品しましょう。</p>
<div class="point">📌 まとめ<br>・最初は家の不用品で練習<br>・相場から逆算して仕入れ値の上限を決める<br>・利益率20%前後が目安<br>・在庫切れキャンセルは評価を下げる。手元の物だけ出品</div>`,
quiz:[
["初心者の練習に最適な仕入れ先は？",["家の不用品","海外の卸","高級ブランド店","知らない人の倉庫"],0,"仕入れ値0円なので、失敗しても損が少ないです。"],
["仕入れ値を決めるときの正しい順番は？",["相場を調べてから逆算する","先に仕入れてから相場を調べる","定価で決める","なんとなく決める"],0,"売れる値段を先に調べてから、仕入れてよい上限を出します。"],
["仕入れてよい上限を出すとき、相場から引かないものは？",["自分の年齢","手数料","送料","ほしい利益"],0,"手数料・送料・関税・ほしい利益を引きます。"],
["初心者の利益率の目安は？",["20%前後","1%","90%","利益は考えなくてよい"],0,"20%前後あると、値下げや送料の変化にも耐えやすいです。"],
["中古品を仕入れて売るときに必要なのは？",["古物商許可","調理師免許","英検","運転免許"],0,"中古品の仕入れ販売には古物商許可が必要です。"],
["手元にない商品を出品し、売れてから仕入れる方法は？",["無在庫販売","有在庫販売","予約販売","オークション"],0,"無在庫販売は在庫切れキャンセルの危険があります。"],
["在庫切れでキャンセルするとどうなる？",["アカウントの評価が下がる","手数料が無料になる","評価が上がる","何も起きない"],0,"在庫切れキャンセルは取引の欠陥（Defect）になります。"],
["フリマで仕入れるときの注意点は？",["写真だけで判断するので状態に注意","必ず新品が届く","古物商許可は絶対に不要","返品は必ずできる"],0,"実物を見られないので、状態の確認が大切です。"],
["避けるべき仕入れはどれ？",["偽物の疑いがある物","状態の良い中古カメラ","日本限定のおもちゃ","自分の不用品"],0,"偽物の販売はアカウント停止の危険があります。"],
["利益がプラスになる仕入れ値の範囲を確かめるのに便利なのは？",["アプリの「お金」タブ","天気予報","カレンダー","地図アプリ"],0,"仕入れ値を変えながら利益を確かめられます。"]
]},
{id:7,title:"出品ページ作り",sub:"タイトル・写真・説明文・価格",body:`
<h3>出品ページの6つの要素</h3>
<table><tr><th>要素</th><th>ポイント</th></tr>
<tr><td>タイトル</td><td>最大80文字。ブランド名・型番・特徴を英語で入れる</td></tr>
<tr><td>Item specifics</td><td>ブランド・型番・色など。検索に使われるのでできるだけ埋める</td></tr>
<tr><td>Condition（状態）</td><td>新品・中古などを正直に選ぶ</td></tr>
<tr><td>写真</td><td>最大24枚まで無料。明るく白い背景で</td></tr>
<tr><td>説明文</td><td>短くわかりやすい英語で。傷や不具合は必ず書く</td></tr>
<tr><td>価格・配送・返品</td><td>価格、発送までの日数、返品の条件を設定</td></tr></table>
<h3>タイトルの作り方</h3>
<p>買い手が検索する言葉を並べます。例：<br><b>Canon AE-1 Program 35mm Film Camera 50mm Lens Tested Japan</b><br>（ブランド・型番・種類・付属品・状態・日本）</p>
<p>「Wow」「Look」など検索されない言葉は入れません。</p>
<h3>写真のコツ</h3>
<ul><li>白い背景・明るい自然光で撮る</li><li>正面・裏・横・付属品・型番ラベルを撮る</li><li><b>傷や汚れははっきり写す</b>（後のトラブルを防ぐ）</li></ul>
<h3>説明文のコツ</h3>
<p>英語が苦手でも、決まった形で書けば大丈夫です。例：</p>
<p><b>Condition:</b> Used. Works properly. Small scratches on the body (see photos).<br>
（状態：中古。正常に動きます。本体に小さな傷があります（写真を見てください）。）</p>
<h3>価格の決め方</h3>
<ul><li>Soldの相場を見て、同じ状態の商品と比べて決める</li><li><b>Best Offer（値下げ交渉）</b>をオンにすると、買い手が値段を提案できる</li></ul>
<h3>発送日数と返品</h3>
<ul><li>Handling time（発送までの日数）：守れる日数で。短いほど有利</li><li>返品：30日の返品を受け付けると買い手が安心し、売れやすくなる</li></ul>
<div class="point">📌 まとめ<br>・タイトルは80文字に検索される言葉を並べる<br>・Item specificsはできるだけ埋める<br>・傷は写真と説明文で必ず伝える<br>・Best Offerと30日返品で売れやすくなる</div>`,
quiz:[
["eBayのタイトルの最大文字数は？",["80文字","20文字","200文字","無制限"],0,"タイトルは最大80文字です。"],
["タイトルに入れるべき言葉は？",["ブランド名や型番など検索される言葉","Wow や Look","自分の名前","絵文字"],0,"買い手が検索する言葉を入れます。"],
["ブランド・型番・色などを入力する項目は？",["Item specifics","Feedback","Seller Hub","Terapeak"],0,"Item specificsは検索に使われるので、できるだけ埋めます。"],
["無料で載せられる写真の最大枚数は？",["24枚","1枚","5枚","100枚"],0,"最大24枚まで無料で載せられます。"],
["商品の傷について正しい対応は？",["写真と説明文ではっきり伝える","写さないようにする","売れてから伝える","小さい傷なら書かない"],0,"隠すと「説明と違う」トラブルになります。"],
["買い手が値段を提案できる機能は？",["Best Offer","Buy It Now","Auction","Free Shipping"],0,"Best Offerをオンにすると値下げ交渉を受けられます。"],
["Handling timeとは？",["売れてから発送するまでの日数","配達にかかる日数","出品期間","返品期間"],0,"守れる日数に設定し、短いほど有利です。"],

{id:8,title:"梱包と発送",sub:"SpeedPAK・日本郵便・梱包",body:`
<h3>主な発送方法</h3>
<table><tr><th>方法</th><th>特徴</th></tr>
<tr><td>eBay SpeedPAK</td><td>eBay公式の配送サービス（運営はOrange Connex社）。専用サイトCPaSSでラベルを作る。セラー保護がある</td></tr>
<tr><td>日本郵便</td><td>郵便局から出せる。国や送り方で関税の扱いが違うので事前に確認</td></tr>
<tr><td>クーリエ（FedEx・DHLなど）</td><td>速くて追跡が確実。高額品・重い物向け</td></tr></table>
<h3>SpeedPAKのセラー保護</h3>
<p>決めた発送日数内に発送し、SpeedPAKの追跡番号（EX・EM・EEで始まる）を登録すると、<b>商品未着が理由の悪い評価が自動で削除</b>されるなどの保護があります。初心者に心強いサービスです。</p>
<h3>追跡番号は必ず登録</h3>
<p>発送したら、追跡番号をeBayに登録します。追跡番号がないと、「届かない」と言われたときに証明できません。</p>
<h3>梱包のコツ</h3>
<ul><li>商品をプチプチ（緩衝材）で包む</li><li>箱の中で動かないようにすき間を埋める</li><li>雨に備えてビニール袋に入れる</li><li>壊れやすい物は箱を二重にする</li><li>箱を軽く振って、音がしないか確かめる</li></ul>
<h3>送料の考え方</h3>
<p>送料は<b>重さと箱の大きさ</b>で決まります（大きくて軽い箱は「容積重量」で計算されることがある）。箱は商品に合った小さめのものを使いましょう。</p>
<h3>発送期限を守る</h3>
<p>Handling time内に発送できないと「発送遅延」になり、評価に影響します。土日や休みの前は特に注意しましょう。</p>
<div class="point">📌 まとめ<br>・初心者はセラー保護があるSpeedPAKが安心<br>・追跡番号は必ず登録<br>・緩衝材・すき間埋め・防水で梱包<br>・送料は重さと大きさで決まる。箱は小さめに</div>`,

["eBay公式の配送サービスは？",["eBay SpeedPAK","ゆうパック","クロネコDM便","レターパック"],0,"SpeedPAKはeBay公式の配送サービスです。"],

["梱包のコツとして正しくないのは？",["すき間はそのままにする","緩衝材で包む","ビニール袋で防水する","壊れやすい物は二重箱"],0,"すき間があると中で動いて壊れます。"],

{id:9,title:"関税・輸出ルール",sub:"米国DDP・EU・送れない物",body:`
<p class="date">情報確認日：2026年11月22日（関税のルールは変わりやすいので、必ず最新を確認してください）</p>
<h3>DDPとDDUの違い</h3>
<table><tr><th>方式</th><th>関税を払う人</th></tr>
<tr><td>DDP（関税込み）</td><td>セラーが発送時に前払い。買い手は受け取り時に払わなくてよい</td></tr>
<tr><td>DDU（関税別）</td><td>買い手が受け取り時に払う。「着払い」に近い</td></tr></table>
<h3>アメリカ向け：DDPが必須</h3>
<ul><li><b>2025年10月17日以降の取引</b>から、日本からアメリカへ送る<b>2,500ドル未満</b>（送料を除く）の商品はDDPでの発送が必須</li><li>すべての配送会社が対象（真贋保証サービスの対象商品は除く）</li><li>DDUで送って関税が理由の「商品未着」トラブルになると、<b>セラーの責任</b>として処理され、評価に傷が付く</li></ul>
<p>アメリカは800ドル以下の輸入品を免税にしていたルール（デミニミス・ルール）をやめたため、少額の商品にも関税がかかります。関税の費用を販売価格か送料に入れておきましょう。</p>
<h3>EU（ヨーロッパ連合）向け</h3>
<ul><li>2026年7月1日から、150ユーロ以下の商品にも関税（1品ごとに3ユーロ）がかかるようになった</li><li>2026年10月1日から、日本からEUへの150ユーロ以下の商品はDDPでの発送が必須</li><li>日本郵便によると、2026年11月1日から取扱手数料（2ユーロ）も加わった</li></ul>
<p>イギリスはEUではないので、このEUのルールは対象外です。</p>
<h3>正しく申告する</h3>
<p>商品名・価格・数量・原産国・HSコード（世界共通の品目番号）を正確に書きます。うその申告（安く書くなど）は違法です。</p>
<h3>送れない物・注意が必要な物</h3>
<ul><li>生もの・多くの食品</li><li>リチウム電池だけ（機器に入った物も条件あり）</li><li>香水・スプレー缶など燃えやすい物</li><li>象牙・べっ甲など（ワシントン条約）</li><li>医薬品・現金・偽物</li></ul>
<p>送れる物は配送会社や国で違います。迷ったら配送会社に確認しましょう。</p>
<div class="point">📌 まとめ<br>・DDPはセラーが関税を前払いする方式<br>・アメリカ向け（2,500ドル未満）はDDP必須<br>・EU向け（150ユーロ以下）もDDP必須に<br>・関税の費用を価格に入れる。申告は正確に</div>`,
quiz:[
["DDPとはどんな方式？",["セラーが関税を前払いする","買い手が受け取り時に関税を払う","関税がかからない","eBayが関税を払う"],0,"DDPは関税込みで、買い手は受け取り時に払いません。"],

["アメリカ向けにDDUで送り、関税が理由で未着トラブルになると？",["セラーの責任として処理される","買い手の責任になる","eBayが全額払う","何も起きない"],0,"セラー保護の対象外になり、評価に傷が付きます。"],
["アメリカがやめた、800ドル以下を免税にしていたルールは？",["デミニミス・ルール","VeRO","Best Offer","Top Rated"],0,"デミニミス・ルールの撤廃で少額品にも関税がかかります。"],

{id:10,title:"お客様対応",sub:"英語定型文・返品・トラブル",body:`
<h3>対応の3原則</h3>
<ul><li><b>24時間以内に返信</b>する</li><li>短く・丁寧に・正直に</li><li>トラブルは<b>eBayが入る前に</b>自分で解決する</li></ul>
<h3>英語が苦手でも大丈夫</h3>
<p>「便利」タブの定型文に、よく使う英語の文と日本語訳を用意しています。コピーして使えます。届いたメッセージは翻訳アプリで日本語にして読みましょう。</p>
<h3>よくあるトラブルと対応</h3>
<table><tr><th>トラブル</th><th>対応</th></tr>
<tr><td>商品が届かない（Item not received）</td><td>追跡番号で状況を確認して伝える。長く止まっていたら配送会社に問い合わせ</td></tr>
<tr><td>説明と違う（Item not as described）</td><td>写真を送ってもらい、謝って返品か一部返金を提案する</td></tr>
<tr><td>キャンセルしてほしい</td><td>発送前ならすぐ応じる</td></tr>
<tr><td>値下げしてほしい</td><td>Best Offerで受けるか、丁寧に断る</td></tr></table>
<h3>ケース（Case）とは</h3>
<p>買い手がeBayに正式に助けを求めることです。セラーが解決できずにeBayが買い手の味方をして終わると（cases closed without seller resolution）、評価に大きく影響します。<b>ケースになる前に、メッセージで解決する</b>のが一番です。</p>
<h3>返品の対応</h3>
<ul><li>返品を受けたら、届いた商品の状態を確認してから返金</li><li>商品の不具合が原因ならセラーが返送料を負担</li></ul>
<h3>評価（フィードバック）</h3>
<p>取引が終わると、買い手が良い・普通・悪いの評価を付けます。悪い評価を付けられそうなときは、まず誠実に問題を解決しましょう。</p>
<div class="point">📌 まとめ<br>・24時間以内に、短く丁寧に返信<br>・定型文と翻訳アプリで英語は乗り切れる<br>・ケースになる前にメッセージで解決<br>・不具合の返品は返送料をセラーが負担</div>`,
quiz:[
["買い手のメッセージへの返信の目安は？",["24時間以内","1週間以内","1か月以内","返信しなくてよい"],0,"24時間以内に返信するのが基本です。"],
["「Item not received」の意味は？",["商品が届かない","説明と違う","支払いがない","キャンセルしたい"],0,"商品が届いていないという申し立てです。"],

["買い手がeBayに正式に助けを求めることを何と言う？",["ケース（Case）","オファー","リスティング","フィードバック"],0,"ケースが開かれると、解決できない場合にeBayが判断します。"],
["トラブル解決で一番大切なことは？",["ケースになる前にメッセージで解決する","eBayに全部任せる","返信しない","買い手を責める"],0,"自分で解決できればアカウントへの影響を防げます。"],

["返品された商品の返金はいつする？",["届いた商品の状態を確認してから","届く前に必ず","返金しない","1年後"],0,"状態を確認してから返金します。"],
["英語のメッセージを読むのに便利なのは？",["翻訳アプリ","電卓","時計","カメラのフラッシュ"],0,"翻訳アプリで日本語にして読みましょう。"],

{id:11,title:"アカウントを守る",sub:"評価・Defect・セラーレベル",body:`
<h3>セラーレベルは3段階</h3>
<table><tr><th>レベル</th><th>意味</th></tr>
<tr><td>Top Rated</td><td>最高評価。検索で表示されやすくなる</td></tr>
<tr><td>Above Standard</td><td>標準以上。アカウントを作った時はここから始まる</td></tr>
<tr><td>Below Standard</td><td>標準以下。販売の制限や手数料が上がることがある</td></tr></table>
<p>レベルは<b>毎月20日</b>に、最近の取引をもとに評価されます。</p>
<h3>守るべき最低基準（ebay.com）</h3>
<ul><li><b>取引の欠陥率（Transaction defect rate）</b>：2%以下</li><li><b>セラーが解決しなかったケース</b>：2件以下（または取引の0.3%以下）</li></ul>
<p>この2つを超えるとBelow Standardになります。</p>
<h3>Defect（欠陥）になるもの</h3>
<ul><li>在庫切れによるキャンセル</li><li>セラーが解決しないまま終わったケース</li></ul>
<h3>Top Ratedになるには</h3>
<ul><li>欠陥が少ない</li><li>発送遅延が少ない</li><li>追跡番号をきちんと登録している</li><li>ある程度の販売実績がある</li></ul>
<h3>Top Rated Plus</h3>
<p>Top Ratedのセラーの出品のうち、<b>1営業日以内の発送</b>と<b>30日以上の無料返品</b>を設定した出品は、認定バッジが付き、落札手数料が<b>10%割引</b>されます。</p>
<h3>やってはいけないこと</h3>
<ul><li>アカウントを複数作る</li><li>偽物や禁止品を出品する</li><li>eBayの外で取引しようと誘う（直接取引の誘い）</li></ul>
<div class="point">📌 まとめ<br>・レベルは毎月20日に評価。最初はAbove Standard<br>・欠陥率2%以下、未解決ケース2件以下を守る<br>・在庫切れキャンセルは欠陥になる<br>・Top Rated Plusなら落札手数料10%割引</div>`,
quiz:[
["アカウントを作ったときのセラーレベルは？",["Above Standard","Top Rated","Below Standard","レベルなし"],0,"最初はAbove Standardから始まります。"],
["セラーレベルが評価されるのは毎月何日？",["20日","1日","15日","末日"],0,"毎月20日に評価されます。"],
["ebay.comで守るべき取引の欠陥率の上限は？",["2%","10%","20%","50%"],0,"取引の欠陥率は2%以下が最低基準です。"],
["セラーが解決しなかったケースの上限は？",["2件（または取引の0.3%）","10件","100件","上限なし"],0,"2件以下（または0.3%以下）が最低基準です。"],
["Defect（欠陥）になるのはどれ？",["在庫切れによるキャンセル","買い手からのお礼のメッセージ","早めの発送","良い評価"],0,"在庫切れキャンセルは欠陥になります。"],
["Below Standardになるとどうなる？",["販売の制限や手数料の上昇があり得る","手数料が無料になる","検索で上位になる","何も変わらない"],0,"成績が戻るまで制限を受けることがあります。"],
["Top Rated Plusの条件に含まれるのは？",["1営業日以内の発送と30日以上の無料返品","返品不可","発送まで30日","送料を高くする"],0,"この2つを設定した出品が対象です。"],
["Top Rated Plusの出品で割引されるのは？",["落札手数料が10%割引","送料が無料","関税が無料","出品手数料が倍"],0,"落札手数料が10%割引されます。"],
["Top Ratedに必要なこととして正しいのは？",["追跡番号をきちんと登録する","発送を遅らせる","ケースを放置する","在庫切れを増やす"],0,"追跡番号の登録や発送の速さが大切です。"],
["やってはいけないことは？",["eBayの外で直接取引しようと誘う","24時間以内に返信する","追跡番号を登録する","丁寧に梱包する"],0,"eBay外での取引の誘いは規約違反です。"]

{id:12,title:"税金と記帳",sub:"輸出免税・確定申告",body:`
<div class="warn">⚠️ ここは一般的な説明です。実際の申告は、税務署や税理士に確認してください。</div>
<h3>輸出は消費税がかからない（輸出免税）</h3>
<p>海外へ売る取引は、消費税が<b>免除（0%）</b>されます。これを輸出免税と言います。</p>
<h3>消費税の還付</h3>
<p>仕入れのときに払った消費税は、<b>消費税の課税事業者</b>として申告すると、戻ってくる（還付）ことがあります。そのためには、輸出したことを示す書類（発送の記録など）と仕入れの領収書を保管しておく必要があります。</p>
<h3>確定申告</h3>
<ul><li>会社員の副業の場合、所得（利益）が年20万円を超えると、原則として確定申告が必要</li><li>本業として始めるなら、税務署に<b>開業届</b>を出す</li><li><b>青色申告</b>にすると、条件を満たせば最大65万円の控除が受けられる（帳簿付けとe-Taxなどが条件）</li></ul>
<h3>記帳（帳簿付け）で残すもの</h3>
<table><tr><th>記録</th><th>どこで手に入る</th></tr>
<tr><td>売上・手数料</td><td>eBayのSeller Hubのレポート</td></tr>
<tr><td>入金・両替</td><td>Payoneerの取引明細</td></tr>
<tr><td>仕入れ</td><td>領収書・レシート</td></tr>
<tr><td>送料・関税</td><td>配送会社の明細</td></tr></table>
<h3>ドルの売上を円にする</h3>

<p class="date">情報確認日：${INFO_DATE}（手数料は変わることがあるので、セラーポータルで最新を確認してください）</p>
<h3>引かれるお金の全体</h3>
<table><tr><th>タイミング</th><th>手数料</th><th>目安</th></tr>
<tr><td>出品するとき</td><td>出品手数料</td><td>毎月250品まで無料。超えると1品$0.35（ストアなし）</td></tr>
<tr><td>売れたとき</td><td>落札手数料（FVF）</td><td>多くのカテゴリーで13.6%。本・音楽などは15.3%</td></tr>
<tr><td>売れたとき</td><td>1注文ごとの手数料</td><td>$10超の注文は$0.40、$10以下は$0.30</td></tr>
<tr><td>海外に売ったとき</td><td>海外決済手数料</td><td>日本のセラーは1.35%</td></tr>
<tr><td>円に替えるとき</td><td>為替の手数料</td><td>Payoneerから引き出すときの差</td></tr></table>
<h3>大事なポイント：送料にも手数料がかかる</h3>
<p>落札手数料（FVF）は、商品代金だけでなく<b>送料や税金を含めた「売上総額」</b>にかかります。送料を高くしても、そのぶん手数料も増えます。</p>
<h3>計算例（$50の商品・送料無料）</h3>
<table><tr><td>落札手数料</td><td>$50 × 13.6% = $6.80</td></tr>
<tr><td>1注文の手数料</td><td>$0.40</td></tr>
<tr><td>海外決済手数料</td><td>$50 × 1.35% ≒ $0.68</td></tr>
<tr><th>eBayに払う合計</th><th>約$7.88（売上の約16%）</th></tr></table>
<p>ざっくり<b>「売上の約15〜16%はeBayに引かれる」</b>と覚えておきましょう。</p>
<h3>利益の出し方</h3>
<div class="point">利益 ＝ 売上（円） − eBay手数料 − 為替の手数料 − 仕入れ値 − 実際の送料 − 関税など</div>
<p>アメリカ向けは関税をセラーが先払いする方法（DDP）が必須になっています（段階9で説明）。その費用も計算に入れます。「お金」タブの利益計算で実際に計算できます。</p>
<div class="point">📌 まとめ<br>・落札手数料は多くのカテゴリーで13.6%<br>・手数料は送料を含めた売上総額にかかる<br>・海外決済手数料1.35%と1注文$0.30〜0.40も忘れずに<br>・目安：売上の約15〜16%がeBayの取り分</div>`,
quiz:[
["売れたときにかかる中心の手数料は？",["落札手数料（FVF）","出品手数料","ストア月額","広告費"],0,"Final Value Fee（FVF）が手数料の中心です。"],
["多くのカテゴリーの落札手数料の率は？",["13.6%","5%","30%","1.35%"],0,"多くのカテゴリーで13.6%です（ストアなしの場合）。"],
["落札手数料がかかる「売上総額」に含まれるのは？",["商品代金と送料（税金なども含む）","商品代金だけ","送料だけ","仕入れ値"],0,"送料や税金も含めた売上総額にかかります。"],
["日本のセラーが海外に売ったときの海外決済手数料は？",["1.35%","0%","10%","13.6%"],0,"日本の住所のセラーは1.35%です。"],
["$10を超える注文にかかる1注文ごとの手数料は？",["$0.40","$0.30","$1.00","無料"],0,"$10超は$0.40、$10以下は$0.30です。"],
["出品手数料の無料枠（ストアなし）は毎月何品まで？",["250品","10品","1,000品","無制限"],0,"毎月250品まで無料です。"],
["$50で売れたときの落札手数料（13.6%）は？",["$6.80","$0.68","$13.60","$5.00"],0,"50 × 0.136 = 6.80ドルです。"],
["eBayに払う手数料の目安は売上のおよそ何%？",["15〜16%","1〜2%","40〜50%","0%"],0,"落札手数料＋1注文の手数料＋海外決済手数料で、約15〜16%です。"],
["送料を高く設定するとどうなる？",["送料分にも手数料がかかり、手数料も増える","手数料は変わらない","手数料が安くなる","送料は売上に入らない"],0,"手数料は送料を含む売上総額にかかります。"],
["利益の計算に入れなくてよいものは？",["自分の趣味の時間","仕入れ値","実際の送料","関税（DDP）の費用"],0,"仕入れ値・送料・関税は必ず計算に入れます。"]
]},
{id:4,title:"販売リミット",sub:"出品数の上限と増やし方",body:`
<h3>販売リミット（セリングリミット）とは</h3>
<p>eBayでは、出品できる<b>「数」</b>と<b>「合計金額」</b>に上限があります。これを販売リミット（セリングリミット）と言います。例えば「100品・5,000ドル」なら、出品中の商品は100品まで、合計5,000ドルまでです。</p>
<h3>始めたばかりの上限</h3>
<p>新しいセラーは、多くの場合<b>「月10品まで、または合計500ドルまで」</b>のどちらか先に達するほうが上限です（アカウントによって違います）。</p>
<h3>リミットの確認方法</h3>
<ul><li>Seller Hub（セラーハブ）の「Overview」→「Monthly limits」</li></ul>
<h3>リミットを増やす（リミットアップ）</h3>
<ul><li><b>自動で増える</b>：eBayは毎月アカウントを確認し、販売状況と評価をもとに自動で調整します</li>
<li><b>自分で申請する</b>：セラーポータルに「リミットアップリクエストをする」が表示されたら申請できます。Seller Hubからも申請できます</li></ul>
<p>申請できない状態のときは、ボタンが表示されません。</p>
<h3>リミットアップのコツ</h3>
<ul><li>まずは少ない数をしっかり売る</li><li>すぐ発送し、追跡番号を入れる</li><li>良い評価（フィードバック）を集める</li><li>返品やトラブルを起こさない</li><li>1か月ほど実績を積んでから申請する</li></ul>
<div class="warn">⚠️ リミットが少ないからといって、アカウントを2つ以上作るのはやめましょう。規約違反として停止される危険があります。</div>
<div class="point">📌 まとめ<br>・出品できる数と金額には上限がある<br>・最初は「10品または500ドル」程度が多い<br>・実績と評価で自動的に増える。申請もできる<br>・少しずつ確実に売って信頼を積むのが近道</div>`,
quiz:[
["販売リミットで制限されるものは？",["出品数と出品の合計金額","写真の枚数","メッセージの数","ログイン回数"],0,"出品できる数と合計金額に上限があります。"],
["新しいセラーに多い最初のリミットは？",["月10品または500ドル","月1,000品または10万ドル","無制限","月1品"],0,"多くの場合、10品または500ドルのどちらか先に達するほうが上限です。"],
["リミットが「100品・5,000ドル」のとき、出品できるのは？",["100品まで、かつ合計5,000ドルまで","100品なら金額は自由","5,000ドルなら品数は自由","100品と5,000ドルのどちらか好きな方"],0,"数と金額の両方の上限を守る必要があります。"],
["リミットを確認する場所は？",["Seller Hubの「Monthly limits」","バイヤー用の検索画面","Payoneerの残高画面","郵便局のサイト"],0,"Seller HubのOverviewにあるMonthly limitsで確認します。"],
["eBayはどのくらいの頻度でリミットを自動調整する？",["毎月","10年ごと","調整しない","毎時間"],0,"eBayは毎月アカウントを確認して調整します。"],
["リミットアップを申請できる日本語のサイトは？",["セラーポータル","ヤフオク","Amazonセラーセントラル","メルカリ"],0,"セラーポータルに申請ボタンが表示されたら申請できます。"],
["申請ボタンが表示されないのはどんなとき？",["申請できる状態でないとき","スマホを使っているとき","日曜日","英語設定のとき"],0,"申請できる状態でない場合は表示されません。"],
["リミットアップに役立つ行動は？",["すぐ発送して良い評価を集める","いきなり高額品をたくさん出品する","発送を遅らせる","返品を断り続ける"],0,"実績と良い評価が信頼につながります。"],
["リミットが少ないとき、やってはいけないことは？",["アカウントを2つ以上作る","少ない数を確実に売る","評価を集める","サポートに相談する"],0,"複数アカウントは規約違反で停止される危険があります。"],
["リミットアップの近道として正しい考え方は？",["少しずつ確実に売って信頼を積む","とにかく出品数を増やす","価格を極端に安くする","評価は気にしない"],0,"実績を積み重ねることが一番の近道です。"]
]}
];
STAGES2.forEach(st=>STAGES.push(st));

// ---------- 画面 ----------
const app=document.getElementById("app");
let tab="learn";
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function unlocked(st){return st.id===1||!!mem.passed[st.id-1]}
function setNav(){document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.tab===tab))}
document.querySelectorAll("nav a").forEach(a=>a.onclick=e=>{e.preventDefault();tab=a.dataset.tab;render()});

function render(){setNav();window.scrollTo(0,0);
 if(tab==="learn")renderList();else if(tab==="calc")renderCalc();else if(tab==="qa")renderQA();else if(tab==="tpl")renderTpl();else if(tab==="game")renderGame();else renderRecord();}

function renderList(){
 const n=Object.keys(mem.passed).length;
 let h=`<div class="card"><b>学習の進み具合</b>　${n} / 13 段階 合格<div class="bar"><div style="width:${n/13*100}%"></div></div>
 <div class="date">各段階のテストで${QN}問中${PASS}問以上正解すると、次の段階が開きます。</div></div>`;
 const fn=FIRST.filter((_,i)=>firstDone(i)).length;
 h+=`<div class="stage" id="fs"><div class="num" style="background:#e8a317">🚀</div><div><div class="t">最初の1品ガイド</div><div class="s">${fn} / ${FIRST.length} ステップ完了（実際に作業しながら進める）</div></div></div>`;
 h+=`<div class="stage" id="gn"><div class="num" style="background:#6a4c93">📚</div><div><div class="t">ジャンル別のコツ</div><div class="s">カメラ・トレカ・時計・ゲームなど${GENRES.length}ジャンル</div></div></div>`;
 h+=`<div class="stage" id="jp"><div class="num" style="background:#c62828">🇯🇵</div><div><div class="t">日本から販売するのに必要なこと</div><div class="s">いつでも読めます（準備・許可・税関・証明書類）</div></div></div>`;
 STAGES.forEach(st=>{
  const p=mem.passed[st.id],u=unlocked(st);
  let cls="stage"+(p?" passed":"")+(!u?" locked":"");
  let s=p?`合格 ${p.score}/${QN}（${p.date}）`:u?st.sub:"🔒 前の段階に合格すると開きます";
  h+=`<div class="${cls}" data-id="${st.id}"><div class="num">${p?"✓":st.id}</div><div><div class="t">段階${st.id}　${esc(st.title)}</div><div class="s">${esc(s)}</div></div></div>`;
 });
 const allOk=n>=13, ft=mem.final;
 h+=`<div class="card"><b>🏆 総合テスト</b>（全段階から20問・16問以上で合格）<div class="date">${ft?`合格 ${ft.score}/20（${ft.date}）`:allOk?"挑戦できます":"🔒 全13段階に合格すると開きます"}</div>${allOk?'<button id="final">総合テストを受ける</button>':""}</div>`;
 h+=`<button class="sub" id="rec">🏅 合格の記録・このアプリについて</button>`;
 app.innerHTML=h;
 document.getElementById("rec").onclick=()=>{renderRecord();window.scrollTo(0,0)};
 if(allOk)document.getElementById("final").onclick=startFinal;
 document.getElementById("jp").onclick=renderGuide;
 document.getElementById("fs").onclick=renderFirst;document.getElementById("gn").onclick=renderGenres;
 app.querySelectorAll(".stage[data-id]").forEach(el=>el.onclick=()=>{
  const st=STAGES.find(s=>s.id==el.dataset.id);
  if(!unlocked(st)){alertBox("前の段階のテストに合格すると開きます。");return}
  renderStage(st);
 });
}
function alertBox(msg){
 const d=document.createElement("div");d.className="card";d.style.cssText="position:fixed;left:14px;right:14px;top:40%;z-index:9;text-align:center;border:2px solid #1f4e79";
 d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);
}
function renderGuide(){window.scrollTo(0,0);tab="learn";setNav();
 app.innerHTML=`<div class="card"><h2>🇯🇵 日本から販売するのに必要なこと</h2>${JP_GUIDE}</div><button id="ck">始める前チェックリストを開く</button><button class="sub" id="back">一覧に戻る</button>`;
 document.getElementById("ck").onclick=()=>{tab="tpl";setNav();renderCheck("start")};
 document.getElementById("back").onclick=renderList;
}
function renderStage(st){window.scrollTo(0,0);
 app.innerHTML=`<div class="card"><h2>段階${st.id}　${esc(st.title)}</h2>${st.body}</div>
 <button id="go">合格テストを受ける（${QN}問）</button><button class="sub" id="back">一覧に戻る</button>`;
 document.getElementById("go").onclick=()=>startQuiz(st);
 document.getElementById("back").onclick=renderList;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(st){
 runTest({label:`段階${st.id}のテスト`,pool:st.quiz.map(q=>q.concat([st.id])),n:QN,pass:PASS,
  okMsg:st.id<13?`段階${st.id+1}が開きました。`:"全段階合格！一覧から総合テストに挑戦できます。",
  onPass:score=>{const prev=mem.passed[st.id];if(!prev||score>=prev.score)mem.passed[st.id]={score,date:today()};save();},
  retry:()=>startQuiz(st),read:()=>renderStage(st)});
}
function startFinal(){
 const pool=[];STAGES.forEach(st=>st.quiz.forEach(q=>pool.push(q.concat([st.id]))));
 runTest({label:"総合テスト",pool,n:20,pass:16,okMsg:"🎓 eBay販売マスター 修了です！おめでとうございます。",
  onPass:score=>{if(!mem.final||score>=mem.final.score)mem.final={score,date:today()};save();},
  retry:startFinal,read:null});
}
function today(){const d=new Date();return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}
function runTest(cfg){
 const qs=shuffle(cfg.pool).slice(0,cfg.n).map(q=>{const order=shuffle([0,1,2,3]);return{q:q[0],opts:order.map(i=>q[1][i]),ans:order.indexOf(q[2]),exp:q[3],sid:q[4]}});
 const N=qs.length;let idx=0,answers=[];
 function show(){window.scrollTo(0,0);
  const q=qs[idx];
  app.innerHTML=`<div class="card"><div class="qhead">${cfg.label}　${idx+1} / ${N}問</div><div class="bar"><div style="width:${idx/N*100}%"></div></div>
  <p><b>${esc(q.q)}</b></p>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{answers.push(+b.dataset.i);idx++;idx<N?show():result()});
 }
 function result(){window.scrollTo(0,0);
  const score=qs.reduce((s,q,i)=>s+(answers[i]===q.ans?1:0),0),ok=score>=cfg.pass;
  if(ok)cfg.onPass(score);
  let h=`<div class="card" style="text-align:center"><div style="font-size:48px">${ok?"🎉":"📖"}</div>
  <h2>${ok?"合格！":"もう少し！"}</h2><div class="res"><span class="big">${score} / ${N}</span> 問正解</div>
  <p>${ok?cfg.okMsg:`合格は${cfg.pass}問以上です。下の解説を読んで、もう一度挑戦しましょう。`}</p></div>`;
  qs.forEach((q,i)=>{const r=answers[i]===q.ans;
   h+=`<div class="card"><div class="qhead">${i+1}問目（段階${q.sid}）　${r?'<span class="plus">⭕ 正解</span>':'<span class="minus">❌ 不正解</span>'}</div><b>${esc(q.q)}</b>
   ${r?"":`<div>あなたの答え：${esc(q.opts[answers[i]])}</div>`}<div>正解：<b>${esc(q.opts[q.ans])}</b></div><div class="exp">${esc(q.exp)}</div></div>`});
  h+=ok?`<button id="next">一覧に戻る</button>`:`<button id="re">もう一度テスト（問題は入れ替わります）</button>${cfg.read?'<button class="sub" id="read">解説を読み直す</button>':'<button class="sub" id="next">一覧に戻る</button>'}`;
  app.innerHTML=h;
  const nx=document.getElementById("next");if(nx)nx.onclick=renderList;
  if(!ok){document.getElementById("re").onclick=cfg.retry;if(cfg.read)document.getElementById("read").onclick=cfg.read;}
 }
 show();
}

// ---------- 質問コーナー ----------
function norm(t){return String(t).toLowerCase().replace(/[？?。、！!\s　]/g,"")}
function expand(q){let t=norm(q);SYN.forEach(g=>{if(g.some(w=>t.includes(norm(w))))t+=g.map(norm).join("")});return t}
function searchQA(q){
 const t0=norm(q),t=expand(q);if(!t)return[];
 const res=[];
 QA.forEach(x=>{let sc=0;x[2].forEach(k=>{const n=norm(k);if(t0.includes(n))sc+=2;else if(t.includes(n))sc+=1});if(t0.length>=4&&norm(x[0]).includes(t0))sc+=3;if(sc)res.push({type:"qa",sc,x})});
 GLOSSARY.forEach(g=>{const w=g[0].split(/[（）\/ ]/).map(norm).filter(v=>v.length>1&&v!=="ebay");if(w.some(v=>t0.includes(v)))res.push({type:"g",sc:1.5+Math.max(...w.map(v=>t0.includes(v)?v.length/10:0)),x:g})});
 return res.sort((a,b)=>b.sc-a.sc).slice(0,6);
}
function stageLink(id){if(id==-1)return `<a href="#" class="go" data-id="-1">→「最初の1品ガイド」を開く</a>`;if(id==0)return `<a href="#" class="go" data-id="0">→「日本から販売するのに必要なこと」を読む</a>`;const st=STAGES.find(s=>s.id==id);return `<a href="#" class="go" data-id="${id}">→ 段階${id}「${esc(st.title)}」を読む</a>`}
function renderQA(q){
 q=q||"";
 let h=`<div class="card"><h2>質問コーナー</h2><p class="date">知りたいことを入力してください（例：送料にも手数料はかかる？／関税は誰が払う？）。ネットなしでも使えます。</p>
 <form id="f"><input id="q" placeholder="質問を入力" value="${esc(q)}"><button>探す</button></form></div><div id="ans"></div>
 <div class="card"><button class="sub" id="gl">📖 用語集を見る（${GLOSSARY.length}語）</button>${(mem.memo&&mem.memo.length)?`<button class="sub" id="mm">📝 未解決メモ（${mem.memo.length}件）</button>`:""}</div>`;
 app.innerHTML=h;
 const f=document.getElementById("f");
 f.onsubmit=e=>{e.preventDefault();showAns(document.getElementById("q").value.trim())};
 document.getElementById("gl").onclick=renderGlossary;
 const mm=document.getElementById("mm");if(mm)mm.onclick=renderMemo;
 if(q)showAns(q);
}
function showAns(q){
 const box=document.getElementById("ans");if(!q){box.innerHTML="";return}
 const r=searchQA(q);
 if(!r.length){box.innerHTML=`<div class="card">見つかりませんでした。言葉を変えて試してみてください（例：「送料」「関税」「返品」など短い言葉）。<button class="sub" id="save">この質問を未解決メモに残す</button></div>`;
  document.getElementById("save").onclick=()=>{mem.memo=mem.memo||[];mem.memo.push({q,date:today()});save();box.innerHTML='<div class="card">未解決メモに残しました。Q&Aを追加するときの参考にします。</div>'};return}
 box.innerHTML=r.map(o=>o.type==="qa"?`<div class="card"><b>Q. ${esc(o.x[0])}</b><p>${esc(o.x[1])}</p>${stageLink(o.x[3])}</div>`
  :`<div class="card"><b>📖 ${esc(o.x[0])}</b><p>${esc(o.x[1])}</p>${stageLink(o.x[2])}</div>`).join("");
 bindGo(box);
}
function bindGo(el){el.querySelectorAll(".go").forEach(a=>a.onclick=e=>{e.preventDefault();if(a.dataset.id=="0"){renderGuide();return}if(a.dataset.id=="-1"){tab="learn";setNav();renderFirst();return}const st=STAGES.find(s=>s.id==a.dataset.id);tab="learn";setNav();
 if(unlocked(st))renderStage(st);else{renderList();alertBox(`段階${st.id}は、前の段階に合格すると読めます。`)}})}

 let h=`<div class="card"><h2>便利ツール</h2><p class="date">チェックリストは出品・発送のたびに使えます。</p>`+CHECKLISTS.map(c=>{const st=(mem.check||{})[c.id]||{};const n=Object.values(st).filter(Boolean).length;

 TEMPLATES.map((t,i)=>`<div class="card"><b>${esc(t[0])}</b><p style="font-family:Georgia,serif">${esc(t[1])}</p><div class="exp">${esc(t[2])}</div><button class="sub cp" data-i="${i}">英文をコピー</button></div>`).join("");

function renderCheck(id){window.scrollTo(0,0);
 const c=CHECKLISTS.find(x=>x.id===id);mem.check=mem.check||{};mem.check[id]=mem.check[id]||{};const st=mem.check[id];
 function draw(){const n=c.items.filter((_,i)=>st[i]).length;
  app.innerHTML=`<div class="card"><h2>${c.title}</h2><div class="bar"><div style="width:${n/c.items.length*100}%"></div></div><div class="date">${n} / ${c.items.length} 完了${n===c.items.length?"　✅ すべてOK！":""}</div></div>
  <div class="card">${c.items.map((t,i)=>`<label class="chk"><input type="checkbox" data-i="${i}" ${st[i]?"checked":""}> ${esc(t)}</label>`).join("")}</div>
  <button class="sub" id="rs">チェックをすべて外す（次の商品へ）</button><button class="sub" id="bk">戻る</button>`;
  app.querySelectorAll(".chk input").forEach(x=>x.onchange=()=>{st[x.dataset.i]=x.checked;save();draw()});
  document.getElementById("rs").onclick=()=>{mem.check[id]={};save();renderCheck(id)};
  document.getElementById("bk").onclick=renderTpl;}
 draw();
}
function fallbackCopy(t,done){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}a.remove()}

// ---------- お金（利益計算・仕入れ上限・記録帳） ----------
let moneyTab="calc";
const f0=n=>Math.round(n).toLocaleString("ja-JP");
function feeCalc(v){
 const total=v.price+v.ship, fvf=total*v.fvf/100, per=total>10?0.40:0.30, intl=total*0.0135;
 const fee=fvf+per+intl, yenNet=(total-fee)*v.rate*(1-v.fx/100);
 return {total,fvf,per,intl,fee,yenNet,salesYen:total*v.rate};
}
function dutyEst(mode,price,rate,eur){
 if(mode==="us")return price*0.15*rate;
 if(mode==="eu")return 5*eur;
 return null;
}
const FVF_OPTS='<option value="13.6">13.6%（多くのカテゴリー）</option><option value="15.3">15.3%（本・映画・音楽）</option><option value="15">15%（時計・バッグなど一部）</option><option value="13.25">13.25%（一部カテゴリー）</option>';
const DUTY_OPTS='<option value="manual">自分で入力</option><option value="us">アメリカ（商品価格の15%）</option><option value="eu">EU（関税3＋手数料2ユーロ）</option><option value="none">なし</option>';
function moneyHead(){
 return `<div class="seg">${[["calc","利益計算"],["rev","仕入れ上限"],["book","記録帳"]].map(x=>`<button class="${moneyTab===x[0]?"on":""}" data-m="${x[0]}">${x[1]}</button>`).join("")}</div>`;
}
function renderCalc(){
 if(moneyTab==="rev")return renderRev();
 if(moneyTab==="book")return renderBook();
 const c=Object.assign({price:50,ship:0,rate:150,fvf:13.6,cost:3000,realShip:2000,duty:0,fx:2,dmode:"us",eur:170},mem.calc||{});
 app.innerHTML=moneyHead()+`<div class="card"><h2>利益計算</h2><p class="date">手数料率は${INFO_DATE}時点の目安です。</p>
 <label>販売価格（ドル）</label><input id="price" type="number" inputmode="decimal" value="${c.price}">
 <label>買い手が払う送料（ドル）　送料無料なら0</label><input id="ship" type="number" inputmode="decimal" value="${c.ship}">
 <label>為替レート（1ドル＝何円）</label><input id="rate" type="number" inputmode="decimal" value="${c.rate}">
 <label>落札手数料の率</label><select id="fvf">${FVF_OPTS}</select>
 <label>仕入れ値（円）</label><input id="cost" type="number" inputmode="numeric" value="${c.cost}">
 <label>実際にかかる送料（円）</label><input id="realShip" type="number" inputmode="numeric" value="${c.realShip}">
 <label>関税の目安</label><select id="dmode">${DUTY_OPTS}</select>
 <div id="eurBox"><label>ユーロのレート（1ユーロ＝何円）</label><input id="eur" type="number" inputmode="decimal" value="${c.eur}"></div>
 <label>関税・その他の費用（円）</label><input id="duty" type="number" inputmode="numeric" value="${c.duty}">
 <label>円に替えるときの手数料（%）</label><input id="fx" type="number" inputmode="decimal" value="${c.fx}">
 <p class="date">${DUTY_INFO}</p></div><div class="card res" id="out"></div><button class="sub" id="toBook">この内容で記録帳に入れる（売れたとき）</button>`;
 bindSeg();
 document.getElementById("toBook").onclick=()=>{mem.draft=Object.assign({},mem.calc);moneyTab="book";renderCalc()};
 document.getElementById("fvf").value=String(c.fvf);document.getElementById("dmode").value=c.dmode;
 const ids=["price","ship","rate","fvf","cost","realShip","duty","fx","eur"];
 function calc(ev){
  if(ev&&ev.target&&ev.target.id==="duty")document.getElementById("dmode").value="manual";
  const v={};ids.forEach(k=>v[k]=parseFloat(document.getElementById(k).value)||0);v.dmode=document.getElementById("dmode").value;
  document.getElementById("eurBox").style.display=v.dmode==="eu"?"":"none";
  const est=dutyEst(v.dmode,v.price,v.rate,v.eur);
  if(est!==null){v.duty=Math.round(est);document.getElementById("duty").value=v.duty}
  if(v.dmode==="none"){v.duty=0;document.getElementById("duty").value=0}
  mem.calc=v;save();
  const r=feeCalc(v), profit=r.yenNet-v.cost-v.realShip-v.duty, rp=r.salesYen?profit/r.salesYen*100:0;
  document.getElementById("out").innerHTML=`<div>利益</div><div class="big ${profit>=0?"plus":"minus"}">${f0(profit)} 円</div><div>利益率（売上に対して）：${rp.toFixed(1)}%</div>
  <table><tr><td>売上総額</td><td>$${r.total.toFixed(2)}（約${f0(r.salesYen)}円）</td></tr>
  <tr><td>落札手数料 ${v.fvf}%</td><td>−$${r.fvf.toFixed(2)}</td></tr><tr><td>1注文の手数料</td><td>−$${r.per.toFixed(2)}</td></tr>
  <tr><td>海外決済手数料 1.35%</td><td>−$${r.intl.toFixed(2)}</td></tr>
  <tr><th>eBay手数料の合計</th><th>−$${r.fee.toFixed(2)}（${r.total?(r.fee/r.total*100).toFixed(1):0}%）</th></tr>
  <tr><td>円での受取額</td><td>${f0(r.yenNet)}円</td></tr><tr><td>仕入れ値</td><td>−${f0(v.cost)}円</td></tr>
  <tr><td>実際の送料</td><td>−${f0(v.realShip)}円</td></tr><tr><td>関税・その他</td><td>−${f0(v.duty)}円</td></tr></table>
  ${profit<0?'<div class="warn">赤字です。販売価格を上げるか、仕入れ値・送料を見直しましょう。</div>':""}
`;
 }
 ids.concat(["dmode"]).forEach(k=>{document.getElementById(k).addEventListener("input",calc);document.getElementById(k).addEventListener("change",calc)});
 calc();
}
function bindSeg(){app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{moneyTab=b.dataset.m;renderCalc()})}

function renderRev(){
 const c=Object.assign({price:50,ship:0,rate:150,fvf:13.6,realShip:2000,fx:2,dmode:"us",eur:170,tmode:"rate",target:20},mem.rev||{});
 app.innerHTML=moneyHead()+`<div class="card"><h2>仕入れ上限の計算</h2><p class="date">売れる値段（Soldの相場）から、仕入れてよい上限を出します。</p>
 <label>売れる値段（ドル）</label><input id="price" type="number" inputmode="decimal" value="${c.price}">
 <label>買い手が払う送料（ドル）</label><input id="ship" type="number" inputmode="decimal" value="${c.ship}">
 <label>為替レート（1ドル＝何円）</label><input id="rate" type="number" inputmode="decimal" value="${c.rate}">
 <label>落札手数料の率</label><select id="fvf">${FVF_OPTS}</select>
 <label>実際にかかる送料（円）</label><input id="realShip" type="number" inputmode="numeric" value="${c.realShip}">
 <label>関税の目安</label><select id="dmode">${DUTY_OPTS.replace('<option value="manual">自分で入力</option>','')}</select>
 <div id="eurBox"><label>ユーロのレート（1ユーロ＝何円）</label><input id="eur" type="number" inputmode="decimal" value="${c.eur}"></div>
 <label>円に替えるときの手数料（%）</label><input id="fx" type="number" inputmode="decimal" value="${c.fx}">
 <label>ほしい利益の決め方</label><select id="tmode"><option value="rate">売上に対する利益率（%）</option><option value="yen">利益の金額（円）</option></select>
 <label id="tl">ほしい利益</label><input id="target" type="number" inputmode="decimal" value="${c.target}"></div><div class="card res" id="out"></div>`;
 bindSeg();
 document.getElementById("fvf").value=String(c.fvf);document.getElementById("dmode").value=c.dmode;document.getElementById("tmode").value=c.tmode;
 const ids=["price","ship","rate","fvf","realShip","fx","eur","target"];
 function calc(){
  const v={};ids.forEach(k=>v[k]=parseFloat(document.getElementById(k).value)||0);v.dmode=document.getElementById("dmode").value;v.tmode=document.getElementById("tmode").value;
  document.getElementById("eurBox").style.display=v.dmode==="eu"?"":"none";
  document.getElementById("tl").textContent=v.tmode==="rate"?"ほしい利益率（%）":"ほしい利益（円）";
  mem.rev=v;save();
  const r=feeCalc(v), duty=dutyEst(v.dmode,v.price,v.rate,v.eur)||0;
  const want=v.tmode==="rate"?r.salesYen*v.target/100:v.target;
  const max=r.yenNet-v.realShip-duty-want;
  document.getElementById("out").innerHTML=`<div>仕入れてよい上限</div><div class="big ${max>0?"plus":"minus"}">${max>0?f0(max)+" 円まで":"仕入れると赤字"}</div>
  <table><tr><td>円での受取額（手数料後）</td><td>${f0(r.yenNet)}円</td></tr><tr><td>実際の送料</td><td>−${f0(v.realShip)}円</td></tr>
  <tr><td>関税の目安</td><td>−${f0(duty)}円</td></tr><tr><td>ほしい利益</td><td>−${f0(want)}円</td></tr></table>
  ${max<=0?'<div class="warn">この値段では、ほしい利益が出ません。もっと高く売れる物を探すか、送料を見直しましょう。</div>':""}`;
 }
 ids.concat(["dmode","tmode"]).forEach(k=>{document.getElementById(k).addEventListener("input",calc);document.getElementById(k).addEventListener("change",calc)});
 calc();
}

function renderBook(){
 mem.book=mem.book||[];
 const d=mem.draft||{};const t=new Date();const ds=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
 let h=moneyHead()+`<div class="card"><h2>記録帳に追加</h2>
 <label>売れた日</label><input id="bd" type="date" value="${ds}">
 <label>商品名</label><input id="bn" placeholder="例：Canon AE-1">
 <label>販売価格（ドル）</label><input id="bp" type="number" inputmode="decimal" value="${d.price??""}">
 <label>買い手が払った送料（ドル）</label><input id="bs" type="number" inputmode="decimal" value="${d.ship??0}">
 <label>為替レート（1ドル＝何円）</label><input id="br" type="number" inputmode="decimal" value="${d.rate??150}">
 <label>落札手数料の率</label><select id="bf">${FVF_OPTS}</select>
 <label>仕入れ値（円）</label><input id="bc" type="number" inputmode="numeric" value="${d.cost??""}">
 <label>実際の送料（円）</label><input id="bx" type="number" inputmode="numeric" value="${d.realShip??""}">
 <label>関税・その他（円）</label><input id="bu" type="number" inputmode="numeric" value="${d.duty??0}">
 <label>円に替えるときの手数料（%）</label><input id="bfx" type="number" inputmode="decimal" value="${d.fx??2}">
 <button id="add">記録する</button></div>`;
 // 月別集計
 const months={};mem.book.forEach((r,i)=>{const m=r.date.slice(0,7);(months[m]=months[m]||[]).push(Object.assign({i},r))});
 const keys=Object.keys(months).sort().reverse();
 const all=mem.book.reduce((a,r)=>({n:a.n+1,s:a.s+r.salesYen,p:a.p+r.profit}),{n:0,s:0,p:0});
 h+=`<div class="card"><h2>集計</h2><div>合計 ${all.n}件　売上 約${f0(all.s)}円　利益 <b class="${all.p>=0?"plus":"minus"}">${f0(all.p)}円</b></div>`;
 if(!keys.length)h+=`<p class="date">まだ記録がありません。</p>`;
 keys.forEach(m=>{const L=months[m];const s=L.reduce((a,r)=>a+r.salesYen,0),p=L.reduce((a,r)=>a+r.profit,0);
  h+=`<h3>${m.replace("-","年")}月　${L.length}件</h3><div>売上 約${f0(s)}円　利益 <b class="${p>=0?"plus":"minus"}">${f0(p)}円</b></div>
  <table><tr><th>日付</th><th>商品</th><th>利益</th><th></th></tr>${L.map(r=>`<tr><td>${r.date.slice(5)}</td><td>${esc(r.name)}</td><td class="${r.profit>=0?"plus":"minus"}">${f0(r.profit)}</td><td><a href="#" class="del" data-i="${r.i}">削除</a></td></tr>`).join("")}</table>`});
 h+=`</div><div class="card"><h2>バックアップ</h2><p class="date">記録はこのiPhoneのブラウザの中だけに保存されます。消えないように、ときどきバックアップをコピーしてメモアプリなどに貼り付けて保管してください。</p>
 <button class="sub" id="csv">表の形でコピー（Excel・Numbers用）</button><button class="sub" id="bk">バックアップをコピー</button>
 <label>バックアップから戻す（コピーした文字を貼り付け）</label><textarea id="rt" rows="3" style="width:100%;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:8px"></textarea><button class="sub" id="rs">戻す</button><div id="msg" class="date"></div></div>`;
 app.innerHTML=h;bindSeg();
 document.getElementById("bf").value=String(d.fvf??13.6);
 document.getElementById("add").onclick=()=>{
  const g=id=>parseFloat(document.getElementById(id).value)||0;
  const v={price:g("bp"),ship:g("bs"),rate:g("br"),fvf:parseFloat(document.getElementById("bf").value),fx:g("bfx")};
  const name=document.getElementById("bn").value.trim()||"（名前なし）";
  if(!v.price){document.getElementById("bp").focus();alertBox("販売価格を入れてください。");return}
  const r=feeCalc(v),cost=g("bc"),rs=g("bx"),du=g("bu");
  mem.book.push({date:document.getElementById("bd").value||ds,name,price:v.price,ship:v.ship,rate:v.rate,fvf:v.fvf,fx:v.fx,cost,realShip:rs,duty:du,feeUsd:+r.fee.toFixed(2),salesYen:Math.round(r.salesYen),profit:Math.round(r.yenNet-cost-rs-du)});
  mem.draft=null;save();alertBox("記録しました。");renderBook();
 };
 app.querySelectorAll(".del").forEach(a=>a.onclick=e=>{e.preventDefault();
  if(a.dataset.c){mem.book.splice(+a.dataset.i,1);save();renderBook()}else{a.dataset.c="1";a.textContent="本当に消す";a.style.color="#c62828"}});
 const msg=t=>document.getElementById("msg").textContent=t;
 const copy=(t,ok)=>{try{navigator.clipboard.writeText(t).then(()=>msg(ok),()=>fallbackCopy(t,()=>msg(ok)))}catch(e){fallbackCopy(t,()=>msg(ok))}};
 document.getElementById("csv").onclick=()=>{
  const head="日付\t商品名\t販売価格(ドル)\t送料(ドル)\tレート\teBay手数料(ドル)\t売上(円)\t仕入れ値\t実送料\t関税他\t利益";
  copy([head].concat(mem.book.map(r=>[r.date,r.name,r.price,r.ship,r.rate,r.feeUsd,r.salesYen,r.cost,r.realShip,r.duty,r.profit].join("\t"))).join("\n"),"コピーしました。Excel・Numbersに貼り付けられます。")};
 document.getElementById("bk").onclick=()=>copy(JSON.stringify({app:"ebay-master",book:mem.book}),"バックアップをコピーしました。メモアプリなどに貼り付けて保管してください。");
 document.getElementById("rs").onclick=()=>{try{const o=JSON.parse(document.getElementById("rt").value);if(!o||!Array.isArray(o.book))throw 0;mem.book=o.book;save();renderBook();alertBox(`${o.book.length}件を戻しました。`)}catch(e){msg("読み込めませんでした。コピーした文字をそのまま貼り付けてください。")}};
}

// ---------- 最初の1品ガイド ----------
function firstDone(i){const s=(mem.first||{})[i]||{};return FIRST[i].tasks.every((_,j)=>s[j])}
function renderFirst(){window.scrollTo(0,0);
 const n=FIRST.filter((_,i)=>firstDone(i)).length;
 app.innerHTML=`<div class="card"><h2>🚀 最初の1品ガイド</h2><p>実際に作業しながら、1つずつ進めます。全部の作業にチェックすると、そのステップが完了になります。</p><div class="bar"><div style="width:${n/FIRST.length*100}%"></div></div><div class="date">${n} / ${FIRST.length} ステップ完了${n===FIRST.length?"　🎉 最初の1品、達成です！":""}</div></div>`+
 FIRST.map((s,i)=>`<div class="stage ${firstDone(i)?"passed":""}" data-f="${i}"><div class="num">${firstDone(i)?"✓":i+1}</div><div><div class="t">${esc(s.t)}</div></div></div>`).join("")+`<button class="sub" id="back">一覧に戻る</button>`;
 app.querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>renderFirstStep(+el.dataset.f));
 document.getElementById("back").onclick=renderList;
}
function renderFirstStep(i){window.scrollTo(0,0);
 mem.first=mem.first||{};mem.first[i]=mem.first[i]||{};const s=FIRST[i],st=mem.first[i];
 function draw(){
  app.innerHTML=`<div class="card"><div class="qhead">ステップ ${i+1} / ${FIRST.length}</div><h2>${esc(s.t)}</h2><p>${esc(s.d)}</p>${stageLink(s.link)}</div>
  <div class="card"><b>やること</b>${s.tasks.map((t,j)=>`<label class="chk"><input type="checkbox" data-j="${j}" ${st[j]?"checked":""}> ${esc(t)}</label>`).join("")}</div>
  ${firstDone(i)?'<div class="point">✅ このステップは完了です！</div>':""}
  ${i<FIRST.length-1?'<button id="nx">次のステップへ</button>':""}${i>0?'<button class="sub" id="pv">前のステップ</button>':""}<button class="sub" id="ls">ステップ一覧</button>`;
  app.querySelectorAll(".chk input").forEach(x=>x.onchange=()=>{st[x.dataset.j]=x.checked;save();draw()});
  const nx=document.getElementById("nx");if(nx)nx.onclick=()=>renderFirstStep(i+1);
  const pv=document.getElementById("pv");if(pv)pv.onclick=()=>renderFirstStep(i-1);
  document.getElementById("ls").onclick=renderFirst;
  bindGo(app);
 }
 draw();
}

function renderGenres(){window.scrollTo(0,0);

function scene(bg,chars){

 if(gAnim)clearInterval(gAnim);let t=0;
 const draw=()=>{ctx.clearRect(0,0,160,96);drawBg(ctx,bg);chars.forEach((c,i)=>drawSprite(ctx,c[0],c[1],c[2]+((t+i)%2&&c[3]!=="still"?-1:0),c[4]))};
 draw();gAnim=setInterval(()=>{if(!document.getElementById("gcv")){clearInterval(gAnim);return}t++;draw()},500);
}

function mkt(k){return Math.round(GITEMS[k][3]*(0.9+Math.random()*0.2))}
function gSave(){mem.game=G;save()}
function gLog(t){G.log.push(t);if(G.log.length>40)G.log.shift()}
const yen=n=>Math.round(n).toLocaleString("ja-JP")+"円";
const usd=n=>"$"+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,"");
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function monthKey(day){return Math.floor((day-1)/30)+1}
function yearKey(day){return Math.floor((day-1)/360)+1}
function addProfit(v){G.st.profitYen+=v;const m=monthKey(G.day);G.mp[m]=(G.mp[m]||0)+v}
function mod(type){return G.mods.filter(m=>m.type===type&&m.until>=G.day).reduce((a,m)=>a*(m.v),1)}
function addMod(type,v,days,label){G.mods=G.mods.filter(m=>m.until>=G.day);G.mods.push({type,v,until:G.day+days-1,label})}

// ---- お金の計算 ----
function feeRate(){return (G.store?0.127:0.136)*(G.level==="Below Standard"?1.3:1)*(G.level==="Top Rated"&&G.store?0.9:1)*mod("fee")}
function netYen(price){return (price*(1-feeRate()-0.0135)-(price>10?0.40:0.30))*G.rate*0.98}
function shipCost(k,m){const s=SHIP[m];return Math.round((s[1]+s[2]*GITEMS[k][4])*mod("ship"))}
function dutyYen(price,cc){if(cc==="us")return price*0.15*G.rate;if(cc==="eu")return 5*(G.rate*1.13);return 0}
function listedUsd(){return G.listings.reduce((a,l)=>a+l.price,0)}
function mkNow(l){return l.mk*mod("mk_"+GENRE_OF[GITEMS[l.k][1]])}

   if(sp==="fake"&&id==="flea"&&Math.random()<0.5){fake=1;f=0.45+Math.random()*0.1}
   return {k,price:Math.round(GITEMS[k][2]*f*mod("shop")/10)*10,fake}});
  gLog(`🏪 ${S.n}に来た。`);gSave();
 }
 const list=G.shops[id];
 gFrame(S.bg,S.bg==="flea"?[["hero",10,70]]:[["shop",30,70],["hero",110,70,0,true]],`${gStatus()}<div class="gbox"><b>${S.n}</b>（${S.d}）<div class="gsmall">${id==="flea"?"写真だけで判断するので、届いたら状態が悪いことも。相場よりずっと安いブランド品は要注意。":id==="antique"?"古い物の中には、海外に出せない物もある。":"相場（リサーチ済みなら表示）と比べて、利益が出るか考えよう。"}</div></div>

 <button class="gbtn gsub" id="gb">◀ お店えらびに戻る</button>`);
 app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const s=list[b.dataset.i];const qn=S.qty||1;if(G.money<s.price*qn||s.bought)return;G.money-=s.price*qn;s.bought=1;
  const yk=yearKey(G.day);G.yc[yk]=(G.yc[yk]||0)+s.price*qn;
  if(qn>1){for(let j=0;j<qn;j++)G.inv.push({u:G.uid++,k:s.k,cost:s.price,used:0,flaw:0,mk:mkt(s.k)});gLog(`📦 ${GITEMS[s.k][0]}を${qn}個まとめて仕入れた（${yen(s.price*qn)}）。`);gSave();gShop(id);return}
  const it=GITEMS[s.k];let flaw=it[6];if(id==="recycle"&&Math.random()<0.3)flaw=1;
  let msg=`🛒 ${it[0]}を${yen(s.price)}で仕入れた。`;
  if(id==="flea"&&Math.random()<0.25){flaw=1;msg+="…届いたら写真より傷が多かった。"}
  G.inv.push({u:G.uid++,k:s.k,cost:s.price,used:it[5],flaw,mk:mkt(s.k),fake:s.fake,bought:id!=="mass"?1:0});
  gLog(msg);gSave();gShop(id)});
 bindBack(gShopList);
}

function gResearch(){

 if(!keys.length){alertBox("調べる商品がありません。");return}
 useAp();
 keys.forEach(k=>{const base=(G.inv.find(i=>i.k===k)||{}).mk||mkt(k);G.research[k]=Math.round(base*(0.97+Math.random()*0.06))});
 G.st.research++;gLog(`🔍 Sold Itemsで${keys.length}種類の相場を調べた。`);gSave();
 gFrame("office",[["hero",40,70]],`${gStatus()}<div class="gbox"><b>リサーチ結果（売れた値段の平均）</b>${keys.map(k=>`<div>${GITEMS[k][1]} ${esc(GITEMS[k][0])}：<b>${usd(G.research[k])}</b></div>`).join("")}<div class="gsmall">※出品価格は送料込みの値段として考えます。</div></div>${back()}`);

}

function gBulk(){

 for(const it of c){const price=G.research[it.k];

function gListPrice(item){
 if(GITEMS[item.k][7]==="cites"){
  G.inv=G.inv.filter(i=>i!==item);addProfit(-item.cost);G.warn++;gLog("🚫 象牙の根付はeBayで出品禁止。日本から輸出するにもワシントン条約の許可が必要…。仕入れ値は損になった。");

  gFrame("trouble",[["ghost",72,40]],`<div class="gbox">🚫 <b>出品できません</b><div>象牙はeBayで禁止されている素材です。ワシントン条約の対象で、日本から海外に送るにも許可が必要です。</div><div class="gsmall">古い工芸品は、素材（象牙・べっ甲・ワニ革など）を必ず確かめよう。（アプリの「日本から販売するのに必要なこと」⑥）</div></div>${back()}`);bindBack();return}
 const r=G.research[item.k];const guess=r||Math.round(GITEMS[item.k][3]*(0.6+Math.random()*0.8));
 const opts=[0.85,1,1.15,1.35].map(f=>Math.max(5,Math.round(guess*f)));
 gFrame("room",[["hero",60,70]],`${gStatus()}<div class="gbox"><b>${esc(GITEMS[item.k][0])}の値段（送料込み）</b><div class="gsmall">${r?`相場は ${usd(r)}。`:"⚠️ 相場を調べていないので、どの値段が正しいかわかりません。"}　高いほど売れにくくなります。</div></div>
 ${opts.map((p,i)=>{const prof=netYen(p)-item.cost-shipCost(item.k,"sp")-dutyYen(p,"us");return `<button class="gbtn" data-p="${p}">${usd(p)}　<span class="gsmall">${["安め","ふつう","高め","かなり高め"][i]}${r?`／アメリカ向け利益の目安 ${yen(prof)}`:""}</span></button>`}).join("")}${back()}`);
 app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>gListQuality(item,+b.dataset.p));
 bindBack(gListPick);

function gListQuality(item,price){
 const qs=[["写真の背景は？",[["白い背景で明るく撮る",1],["散らかった部屋のまま撮る",0]]],
  ["タイトルは？",[[`ブランド・型番・特徴を入れる（例：Japan Limited ...）`,1],["「WOW!! Look!! Rare!!」",0]]]];
 if(item.flaw)qs.push(["傷はどうする？",[["写真と説明文で正直に伝える",1],["書かない（売れやすそう…）",-1]]]);
 if(GITEMS[item.k][1]==="🎵")qs.push(["電圧はどう書く？",[["「日本の100V仕様。変圧器が必要」と書く",1],["書かない",-1]]]);
 if(GITEMS[item.k][1]==="🎮")qs.push(["地域（リージョン）はどう書く？",[["「日本版。海外の本体では動かない場合あり」と書く",1],["書かない",-1]]]);
 let q=0,score=0,hide=0;
 function show(){
  const Q=qs[q];
  gFrame("room",[["hero",60,70]],`${gStatus()}<div class="gbox"><b>出品ページ作り（${q+1}/${qs.length}）</b><div>${esc(Q[0])}</div></div>${shuffle(Q[1]).map(o=>`<button class="gbtn" data-s="${o[1]}">${esc(o[0])}</button>`).join("")}`);
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const s=+b.dataset.s;if(s<0)hide=1;else score+=s;if(Q[0]==="傷はどうする？"&&s>0)G.st.honest++;q++;q<qs.length?show():finish()});
 }
 function finish(){
  if(G.listings.length+1>G.limit.items||listedUsd()+price>G.limit.usd){
   gFrame("office",[["hero",60,70]],`${gStatus()}<div class="gbox">⚠️ 販売リミットをこえるので出品できません。<br>リミット：${G.limit.items}品・${usd(G.limit.usd)}（いま ${G.listings.length}品・${usd(listedUsd())}）<div class="gsmall">売れて枠が空くのを待つか、条件を満たしたら事務所でリミットアップを申請しよう。</div></div>${back()}`);bindBack();return}
  useAp();G.inv=G.inv.filter(i=>i.u!==item.u);
  G.listings.push(Object.assign({},item,{price,q:Math.min(3,score),hide,day:G.day}));
  gLog(`🏷️ ${GITEMS[item.k][0]}を${usd(price)}で出品した。${score>=2&&!hide?"良い出品ページができた！":""}`);
  if(hide)gLog("（大事なことを書かなかった…。後でトラブルにならないといいけど）");
  gSave();gMain();
 }
 show();
}

function gShip(){

 gFrame("post",[["hero",30,70],["box",60,72,"still"],["shop",110,70,0,true]],`${gStatus()}<div class="gbox"><b>発送する注文</b><div class="gsmall">Handling timeは3日。アメリカ・EU向けはDDP（関税込み）で送らないとトラブルになりやすい。発送はまとめて行動1回。</div></div>

 <select class="gsel" data-i="${i}">${Object.entries(SHIP).map(([m,s])=>`<option value="${m}">${s[0]}：${yen(shipCost(o.k,m))}${s[4]?"（DDP）":""}・約${s[3]}日</option>`).join("")}</select>
 <div class="gsmall" id="dty${i}"></div></div>`).join("")}
 <button class="gbtn" id="sendall">まとめて発送する（行動1回）</button>${back()}`);
 const upd=()=>app.querySelectorAll(".gsel").forEach(s=>{const o=G.orders[s.dataset.i],m=s.value,ddp=SHIP[m][4];const d=dutyYen(o.price,o.cc);
  document.getElementById("dty"+s.dataset.i).textContent=ddp?(d?`関税の前払い：${yen(d)}`:"この国はゲーム内では関税なし"):((o.cc==="us"||o.cc==="eu")?"⚠️ DDPではないので、関税トラブルの危険あり":"")});
 app.querySelectorAll(".gsel").forEach(s=>s.onchange=upd);upd();
 document.getElementById("sendall").onclick=()=>{
  let total=0;app.querySelectorAll(".gsel").forEach(s=>{const o=G.orders[s.dataset.i],m=s.value,c=shipCost(o.k,m),d=SHIP[m][4]?dutyYen(o.price,o.cc):0;total+=c+d;
   o.m=m;o.shipCost=c;o.duty=d;o.late=G.day-o.day>3;o.arrive=G.day+SHIP[m][3]});
  useAp();if(G.money<total)gLog("💳 資金が足りないので、クレジットカードで払った（資金がマイナスに）。");G.money-=total;
  G.orders.forEach(o=>{G.transit.push(o);G.st.shipped++;if(o.late)G.st.late++;if(!SHIP[o.m][4]&&(o.cc==="us"||o.cc==="eu"))G.st.ddu++;addProfit(-(o.shipCost+o.duty));G.hist.push({day:G.day,late:o.late?1:0,defect:0,u:o.u})});
  gLog(`📮 ${G.orders.length}件を発送した（送料・関税 ${yen(total)}）。追跡番号も登録！`);
  G.orders=[];gCheckChapter();gSave();G._clear?gClear():gMain();
 };
 bindBack();
}

function toItem(o){return {u:o.u,k:o.k,cost:o.cost,used:o.used,flaw:o.flaw,mk:o.mk,fake:o.fake,bought:o.bought}}

// ---- 返金・欠陥などの共通処理 ----
function refund(o,why){G.money-=o.inc;addProfit(-o.inc);G.st.refunds=(G.st.refunds||0)+1;const yk=yearKey(G.day);G.ys[yk]=(G.ys[yk]||0)-o.price*G.rate;return `↩️ 返金（${yen(o.inc)}）${why?"："+why:""}`}
function defect(u){let h=u!==undefined?G.hist.find(x=>x.u===u):null;if(!h){h={day:G.day,late:0,defect:0};G.hist.push(h)}h.defect=1;G.defects++}
function sellNow(l,price,cn){
 const c=cn||wpick(G.mag?C_MAG:C_BASE);const inc=netYen(price);
 G.money+=inc;G.st.sold++;G.st.salesYen+=price*G.rate;addProfit(inc-l.cost);
 const yk=yearKey(G.day);G.ys[yk]=(G.ys[yk]||0)+price*G.rate;G.countries[c[0]]=1;G.st.maxRate=Math.max(G.st.maxRate||0,G.rate);
 if(l.bought)G.st.usedSold++;if(G.mag&&c[1]!=="us")G.st.magSold++;
 G.orders.push(Object.assign({},l,{price,cn:c[0],cc:c[1],day:G.day,inc,mag:G.mag&&c[1]!=="us"?1:0}));
 G.listings=G.listings.filter(x=>x!==l);
 return `💰 ${GITEMS[l.k][0]}が${usd(price)}で売れた！（${c[0]}）手数料を引いて${yen(inc)}が入金。`;
}

 {id:"gift",w:3,c:()=>true,run:g=>{const k=rnd(HOME_ITEMS);return {bg:"room",ch:[["hero",40,70],["buyer",100,70,0,true]],t:`🎁 友だちが「使わないからあげる」と${GITEMS[k][0]}をくれた。`,o:[["ありがとう！",()=>{g.inv.push({u:g.uid++,k,cost:0,used:1,flaw:Math.random()<0.5?1:0,mk:mkt(k)});return "在庫に追加した。"}]]}}},
 {id:"packing",w:3,c:g=>g.orders.length,run:g=>({bg:"post",ch:[["box",72,72,"still"]],t:"📦 梱包材がなくなった！",o:[["買いに行く（1,500円）",()=>{g.money-=1500;addProfit(-1500);return "梱包材を買いそろえた。"}],["あり合わせの紙でつつむ",()=>{g.orders.forEach(o=>o.weakPack=1);return "⚠️ 今の注文は壊れやすくなったかも…。"}]]})},

function pickEvent(){
 const ok=EVENTS.filter(e=>e.w>0&&e.c(G));if(!ok.length)return null;
 const t=ok.reduce((a,e)=>a+e.w,0);let r=Math.random()*t;for(const e of ok){if((r-=e.w)<0)return e}return ok[0];
}
function gEvent(){
 const e=EVENTS.find(x=>x.id===G.pending[0]);
 if(!e||!e.c(G)){G.pending.shift();gSave();return renderGame()}
 const d=e.run(G);
 gFrame(d.bg,d.ch,`${gStatus()}<div class="gbox"><b>🌅 朝の出来事</b><div>${esc(d.t)}</div></div>${d.o.map((o,i)=>`<button class="gbtn" data-o="${i}">${esc(o[0])}</button>`).join("")}`);
 app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
  if(b.dataset.used)return;app.querySelectorAll("[data-o]").forEach(x=>x.dataset.used=1);
  const res=d.o[b.dataset.o][1]();G.pending.shift();gLog(res);gCheckChapter();gSave();
  gFrame(d.bg,d.ch,`${gStatus()}<div class="gbox">${esc(res)}</div><button class="gbtn" id="gn">つづける</button>`);
  document.getElementById("gn").onclick=()=>G._clear?gClear():renderGame()});
}

// ---- 1日の終わり ----
function gSleep(){
 const ev=[];
 const fbBonus=1+Math.min(0.5,G.fb.pos*0.03)-G.fb.neg*0.05;
 const lvB=G.level==="Top Rated"?1.15:G.level==="Below Standard"?0.7:1;
 G.listings.slice().forEach(l=>{
  const pf=Math.min(3,Math.max(0.03,Math.pow(mkNow(l)/l.price,4)));
  const p=0.10*pf*(0.7+l.q*0.25+(l.hide?0.15:0))*Math.max(0.3,fbBonus)*lvB*(1+G.know*0.02)*mod("sale");
  if(Math.random()<p)ev.push(sellNow(l,l.price));
 });
 // 到着と評価
 G.transit.slice().forEach(t=>{if(G.day+1<t.arrive&&t.done!=="refunded")return;
  G.transit=G.transit.filter(x=>x!==t);
  if(t.done==="refunded"){G.fb.pos++;ev.push(`⭐ 先に返金した${t.cn}の買い手から良い評価。`);return}
  if(t.done==="return"){ev.push(refund(t,"返品が戻ってきた")+`。${GITEMS[t.k][0]}は在庫に戻った。`);const it=toItem(t);it.flaw=1;G.inv.push(it);return}
  if(t.case){if(Math.random()<0.6){G.fb.neg++;const r=refund(t,"ケースでeBayが買い手の味方に");defect(t.u);ev.push(`👻 ケースが解決しないまま終わった。${r}・悪い評価・欠陥が記録された…。`);return}}
  const ddp=SHIP[t.m][4];
  if(!ddp&&(t.cc==="us"||t.cc==="eu")&&Math.random()<0.5){G.fb.neg++;defect(t.u);const r=refund(t,"関税の支払い拒否");
   ev.push(`👻 関税トラブル！${t.cn}の買い手が関税の支払いを断り、荷物が届かなかった。${r}・悪い評価・欠陥…。DDPで送るべきだった。`);return}
  if(t.hide&&t.done!=="partial"&&Math.random()<0.5){G.fb.neg++;const r=refund(t,"説明と違う");
   ev.push(`👻「説明と違う！」…${r}と悪い評価。大事なことは正直に書こう。`);return}
  if(GITEMS[t.k][7]==="fragile"&&(t.weakPack||t.m==="jp")&&Math.random()<0.25){G.fb.neu++;const r=refund(t,"配送中に破損");ev.push(`📦 ${GITEMS[t.k][0]}が配送中に壊れた…。${r}。梱包はしっかりと。`);return}
  if(t.fake){G.fb.neg++;defect(t.u);G.warn++;if(G.warn>=2)G.restrictUntil=G.day+7;const r=refund(t,"偽物");ev.push(`🚫 買い手が鑑定したら偽物だった！${r}・悪い評価・eBayからの警告…。`);return}
  const p=0.82+t.q*0.05-(t.late?0.25:0)-(t.angry?0.3:0)+(t.calm?0.05:0);
  if(Math.random()<p){G.fb.pos++;ev.push(`⭐ ${t.cn}の買い手から良い評価！「Great seller, fast shipping!」`)}
  else{G.fb.neu++;ev.push(`😐 ${t.cn}の買い手から普通の評価。${t.late?"発送が遅れたのが原因かも。":""}`)}
 });
 G.orders.forEach(o=>{if(G.day+1-o.day===3)ev.push(`⚠️ ${GITEMS[o.k][0]}の発送期限は今日まで！`)});
 // 為替と日付
 const old=G.rate;G.rate=Math.max(120,Math.min(180,G.rate*(1+(Math.random()-0.5)*0.012)));
 const oldM=monthKey(G.day);G.day++;G.ap=3;
 if(Math.abs(G.rate-old)>0.7)ev.push(G.rate>old?"💱 円安が進んだ（ドルの売上が円で増える）":"💱 円高が進んだ（ドルの売上が円で減る）");
 if(monthKey(G.day)!==oldM){ev.push(`🗓️ ${oldM}か月目が終わった。利益は ${yen(G.mp[oldM]||0)}。`);
  if(G.store){G.money-=4500;addProfit(-4500);ev.push("🏪 ストアの月額4,500円を支払った。")}}
 if(G.day>1&&(G.day-1)%360===0){const y=yearKey(G.day)-1;if(!G.taxDone.includes(y)){G.taxDue=y;ev.push(`📑 ${y}年目が終わった。年間売上 ${yen(G.ys[y]||0)}。確定申告の季節がやってきた…。`)}}
 if(G.license===1&&G.day>=G.licDay){G.license=2;ev.push("👮 古物商許可が出た！リサイクルショップ・フリマアプリ・骨董市で仕入れられるようになった。")}
 if(G.restrictUntil===G.day-1)ev.push("✅ 販売制限が終わった。また出品できる。");
 // セラーレベル判定（毎月20日）
 if(((G.day-1)%30)+1===20){const ps=periodStats();const o=G.level;
  if(ps.d>=4&&ps.dr>0.02)G.level="Below Standard";
  else if(ps.n>=30&&(ps.dr<=0.005||ps.d<=3)&&(ps.lr<=0.03||ps.l<=5)&&fbRate()>=0.98)G.level="Top Rated";
  else G.level="Above Standard";
  ev.push(`📊 セラーレベル判定：${G.level}${G.level!==o?`（${o}から変わった）`:""}`+(G.level==="Below Standard"?"　手数料が上がり、売れにくくなる…。欠陥を減らそう。":G.level==="Top Rated"?"　検索で表示されやすくなった！":""));}
 // 朝の出来事
 if(G.day>=3&&Math.random()<0.45){const e=pickEvent();if(e)G.pending.push(e.id)}
 G.mods=G.mods.filter(m=>m.until>=G.day);
 if(G.hist.length>400)G.hist=G.hist.filter(x=>x.day>G.day-100);
 gLog(`🌅 ${G.day}日目の朝。`);ev.forEach(gLog);
 if(G.money<0)gLog("⚠️ 資金がマイナスです。売上が入るまで仕入れはできません。");
 gCheckChapter();gSave();
 gFrame("night",[["hero",72,70,"still"]],`<div class="gbox"><b>🌙 ${G.day-1}日目の夜〜${G.day}日目の朝</b>${ev.length?ev.map(e=>`<div>${esc(e)}</div>`).join(""):"<div>特に何もなかった。</div>"}</div><button class="gbtn" id="gn">${G.day}日目をはじめる</button>`);
 document.getElementById("gn").onclick=()=>G._clear?gClear():renderGame();
}
function wpick(list){const t=list.reduce((a,x)=>a+x[2],0);let r=Math.random()*t;for(const x of list){if((r-=x[2])<0)return x}return list[0]}
function gCheckChapter(){
 checkAch();
 let ch=CHAPTERS[G.chapter-1];
 while(ch&&ch.ok(G)&&!G.cleared.includes(ch.n)){G.cleared.push(ch.n);G._clear=ch.n;G.chapter=Math.min(CHAPTERS.length,G.chapter+1);gLog(`🏆 第${ch.n}章クリア！「${ch.t}」`);ch=CHAPTERS[G.chapter-1]}
}
function gClear(){
 const n=G._clear;G._clear=null;gSave();
 if(n===10){gFrame("happy",[["coin",30,30,"still"],["buyer",50,62],["hero",72,62],["shop",94,62,0,true],["coin",114,30,"still"]],`<div class="gbox" style="text-align:center"><div style="font-size:22px">🎉 全10章クリア！</div><div>あなたは立派な「eBay販売マスター」です。</div><div class="gsmall">${G.day}日目　販売 ${G.st.sold}件　良い評価 ${G.fb.pos}件<br>これまでの利益 ${yen(G.st.profitYen)}</div></div><div class="gbox gsmall">ゲームで覚えたこと（リサーチ・正直な出品・DDP・早い発送・ていねいな対応・記録と申告）は、本物のeBayでもそのまま大切です。このあとはフリープレイで称号集めを楽しめます。</div><button class="gbtn" id="gn">フリープレイを続ける</button>`);document.getElementById("gn").onclick=renderGame;return}
 const next=CHAPTERS[G.chapter-1];
 gFrame("night",[["coin",40,40,"still"],["hero",72,70],["coin",104,40,"still"]],`<div class="gbox" style="text-align:center"><div style="font-size:20px">🏆 第${n}章 クリア！</div><div>${esc(CHAPTERS[n-1].t)}</div></div>
 <div class="gbox"><b>次の目標：第${next.n}章</b><div>${esc(next.t)}</div><div class="gsmall">${esc(next.tip)}</div></div><button class="gbtn" id="gn">つづける</button>`);
 document.getElementById("gn").onclick=renderGame;
}

// ---- 確定申告 ----
const TAXQ=[
 ["海外のお客様への販売にかかる消費税は？",["免除される（輸出免税）","10%かかる","8%かかる","2倍かかる"],0,"輸出は消費税が免除されます（輸出免税）。"],
 ["経費にできないものは？",["自分の毎日の食費","送料","eBayの手数料","梱包材"],0,"仕事に使ったお金が経費です。毎日の食費は経費になりません。"],
 ["仕入れの消費税を還付してもらうために必要なのは？",["輸出の記録（伝票の控え）と仕入れの領収書","なにもいらない","買い手の写真","出品ページのスクリーンショットだけ"],0,"輸出の証明書類と仕入れの記録を保管しておきます。"],
 ["ドルの売上は帳簿にどう書く？",["決めたルールで円に直して記録する","ドルのまま","書かない","好きなレートで毎回変える"],0,"同じルールで円に換算して記録します。"],
 ["わからないことがあったら？",["税務署や税理士に相談する","SNSのうわさを信じる","申告しない","買い手に聞く"],0,"正確な判断は税務署や税理士に確認しましょう。"]
];
function gTax(){
 const y=G.taxDue;const qs=shuffle(TAXQ).slice(0,3);let i=0,score=0;
 function show(){const q=qs[i];const ord=shuffle([0,1,2,3]);
  gFrame("office",[["hero",40,70],["police",100,70,0,true]],`<div class="gbox"><b>📑 ${y}年目の確定申告（${i+1}/3）</b><div class="gsmall">年間売上 ${yen(G.ys[y]||0)}　仕入れ ${yen(G.yc[y]||0)}</div><div>${esc(q[0])}</div></div>${ord.map(k=>`<button class="gbtn" data-k="${k}">${esc(q[1][k])}</button>`).join("")}`);
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{if(+b.dataset.k===q[2])score++;i++;i<3?show():done()});}
 function done(){
  let res;G.taxDone.push(y);G.taxDue=0;
  if(score===3){const back=Math.round((G.yc[y]||0)*0.1);G.money+=back;addProfit(back);G.taxOk.push(y);res=`🎉 満点！正しく申告できた。課税事業者として申告した場合の目安として、仕入れにかかった消費税 ${yen(back)} が戻ってきた。`}
  else if(score===2){G.taxOk.push(y);res="✅ 申告は無事に終わった。でも、もう少し勉強しておこう。"}
  else{const pen=Math.max(5000,Math.round((G.ys[y]||0)*0.01));G.money-=pen;addProfit(-pen);res=`⚠️ 申告にまちがいがあり、あとで修正申告と追加の税金（${yen(pen)}）が必要になった…。アプリの段階12で復習しよう。`}
  gLog(res);gCheckChapter();gSave();
  gFrame("office",[["hero",40,70]],`<div class="gbox"><b>確定申告の結果：${score}/3問正解</b><div>${esc(res)}</div><div class="gsmall">※ゲームの申告は簡単にしたものです。実際は税務署や税理士に確認してください。</div></div><button class="gbtn" id="gn">つづける</button>`);
  document.getElementById("gn").onclick=()=>G._clear?gClear():renderGame();
 }
 gFrame("office",[["hero",40,70],["police",100,70,0,true]],`<div class="gbox"><b>📑 確定申告の季節</b><div>${y}年目の売上と経費をまとめて、申告しよう。3問中2問以上正解で合格。</div></div><button class="gbtn" id="go">申告を始める</button>`);
 document.getElementById("go").onclick=show;
}

function checkAch(){ACH.forEach(a=>{if(!G.ach[a[0]]&&a[2](G)){G.ach[a[0]]=G.day;gLog(`🎖️ 称号「${a[0]}」を手に入れた！（${a[1]}）`)}})}
function gAch(){
 gFrame("happy",[["hero",72,60]],`<div class="gbox"><b>🎖️ 称号（${Object.keys(G.ach).length}/${ACH.length}）</b>${ACH.map(a=>`<div>${G.ach[a[0]]?"🎖️ <b>"+esc(a[0])+"</b>":"🔒 ？？？"}　<span class="gsmall">${esc(a[1])}${G.ach[a[0]]?`（${G.ach[a[0]]}日目）`:""}</span></div>`).join("")}</div><button class="gbtn gsub" id="gb">◀ 事務所にもどる</button>`);
